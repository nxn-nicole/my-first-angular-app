<div
  class="flex items-center gap-3 rounded-lg border border-gray-200 bg-white p-4 shadow-sm transition-colors hover:bg-gray-50"
>
  <mat-checkbox [checked]="task().completed" (change)="onToggle()" />
  <div class="flex min-w-0 flex-col gap-0.5">
    <span
      class="text-sm font-medium transition-colors"
      [class.line-through]="task().completed"
      [class.text-gray-400]="task().completed"
      [class.text-gray-800]="!task().completed"
    >
      {{ task().title }}
    </span>
    <span class="text-xs text-gray-400">
      Year {{ task().time.year }} · {{ task().time.season | titlecase }} · Day {{ task().time.day }} · {{ task().time.hour | number:'2.0-0' }}:{{ task().time.minute | number:'2.0-0' }}
    </span>
  </div>
  <mat-icon
    class="ml-auto cursor-pointer text-gray-400 transition-colors hover:text-gray-600"
    (click)="onDelete()"
    >close</mat-icon
  >
</div>
