<div>
  <div class="flex flex-row gap-4 mb-4 items-center justify-center">
    <label>Year</label>
    <input
      type="number"
      [value]="selectedYear()"
      (input)="onYearChange($event)"
      class="w-20 rounded border border-gray-300 px-2 py-1 text-sm focus:outline-none focus:ring-1 focus:ring-gray-400"
      placeholder="1"
    />
  </div>
  <div class="flex flex-row gap-2">
    <button (click)="selectSeason(Season.SPRING)" [class.bg-blue-100]="selectedSeason() === Season.SPRING">Spring</button>
    <button (click)="selectSeason(Season.SUMMER)" [class.bg-blue-100]="selectedSeason() === Season.SUMMER">Summer</button>
    <button (click)="selectSeason(Season.AUTUMN)" [class.bg-blue-100]="selectedSeason() === Season.AUTUMN">Fall</button>
    <button (click)="selectSeason(Season.WINTER)" [class.bg-blue-100]="selectedSeason() === Season.WINTER">Winter</button>
  </div>
  <div class="grid grid-cols-7 gap-1">
    @for (day of days; track day) {
      <button
        (click)="selectDay(day)"
        class="flex h-8 w-8 items-center justify-center rounded-lg text-sm hover:bg-gray-100"
        [class.bg-blue-500]="selectedDay() === day"
        [class.text-white]="selectedDay() === day"
      >
        {{ day }}
      </button>
    }
  </div>
  <div>
    <mat-label>Time</mat-label>
    <input
      [matTimepicker]="picker"
      [value]="selectedHourMinute()"
      (valueChange)="onTimeChange($event)"
      class="ml-4 border border-gray-300 rounded-lg px-2 py-1"
    />
    <mat-timepicker #picker interval="30m" panelClass="custom-timepicker" />
  </div>
</div>
